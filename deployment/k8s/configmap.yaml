apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healing-etl-config
  namespace: self-healing-etl
data:
  ETL_PIPELINE_NAME: self-healing-etl
  K8S_NAMESPACE: self-healing-etl
  BATCH_SIZE: "1000"
  OLLAMA_URL: http://ollama.default.svc.cluster.local:11434
  OLLAMA_ENABLED: "false"
  ENABLE_AUTONOMOUS_HEALING: "true"
  REQUIRE_HEALING_APPROVAL: "true"
  LOG_LEVEL: INFO
  K8S_POLL_INTERVAL_SECONDS: "10"
